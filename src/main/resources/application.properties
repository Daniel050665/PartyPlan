spring.application.name=ProyectoWeb

# Base de datos PostgreSQL (se puede sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/partyplan}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Origen permitido para el frontend Angular
app.cors.allowed-origins=${CORS_ORIGINS:${FRONTEND_URL:http://localhost:4200}}

# Jackson: los campos primitivos ausentes en el JSON toman su valor por defecto
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ===== Servidor (Render usa la variable PORT) =====
server.port=${PORT:8080}
server.address=0.0.0.0

# ===== Pagos con Wompi =====
# Las llaves NUNCA se escriben aqui. Se leen de variables de entorno (Render)
# o del archivo secretos.properties (en tu computador; no se sube a GitHub).
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.private-key=${WOMPI_PRIVATE_KEY:}
wompi.integrity-key=${WOMPI_INTEGRITY_KEY:}
wompi.events-secret=${WOMPI_EVENTS_SECRET:}
# A donde vuelve el usuario despues de pagar
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
spring.config.import=optional:file:./secretos.properties
